apiVersion: apps/v1
kind: Deployment
metadata:
  name: bugbountyai-api
  namespace: default
spec:
  replicas: 3
  selector:
    matchLabels:
      app: bugbountyai-api
  template:
    metadata:
      labels:
        app: bugbountyai-api
    spec:
      containers:
      - name: api
        image: bugbountyai:v2-latest
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: bugbountyai-secrets
              key: database-url
        - name: REDIS_URL
          value: redis://redis-service:6379
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api/v2/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/v2/health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: bugbountyai-service
  namespace: default
spec:
  selector:
    app: bugbountyai-api
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8000
  type: LoadBalancer
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bugbountyai-config
  namespace: default
data:
  LOG_LEVEL: INFO
  API_DEBUG: "false"
  API_WORKERS: "4"
